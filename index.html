<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="GeekForce Hub: career-support workspace for the 4Geeks Academy GeekForce USA team.">
<link rel="icon" href="img/4geeks-icon.png">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>GeekForce Career Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Inter:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&display=swap">
<style>
/* Layout: white 4Geeks-style app bar, one centered work column, soft blue panels; screens switch by #hash. Brand from 4geeks.com: blue #0080FF, navy #00071A, yellow only for wins. */
:root{
  --bg:#FFFFFF; --panel:#F4F8FF; --surface:#FFFFFF; --surface-2:#F5F7FB; --fg:#00071A; --muted:#475066; --faint:#5F687C; --border:#E4E8F0; --border-strong:#D1D8E4;
  --accent:#0080FF; --accent-ink:#0062C4; --accent-soft:rgba(0,128,255,.09); --accent-soft-2:rgba(0,128,255,.16); --btn:#0072E5; --btn-fg:#FFFFFF;
  --navy:#00071A; --navy-fg:#FFFFFF; --yellow:#FFBE1A; --yellow-soft:rgba(255,190,26,.20); --yellow-ink:#6B4A00;
  --danger:#B42318; --danger-soft:rgba(201,29,29,.07); --ok:#0B7A4B; --ok-soft:rgba(11,122,75,.09);
  --p-ai:#0080FF; --p-fs:#6D5BD0; --p-ds:#0E9384; --p-cy:#D9483B;
  --logo-filter:none; --shadow:0 1px 2px rgba(0,7,26,.04),0 8px 24px rgba(0,7,26,.06); --shadow-lg:0 24px 60px rgba(0,7,26,.18);
  --font-display:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --font-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060A14; --panel:#0C1424; --surface:#0E1628; --surface-2:#141D32; --fg:#EEF2F8; --muted:#B2BACB; --faint:#98A1B4; --border:#222C44; --border-strong:#2E3A57;
  --accent:#3D9BFF; --accent-ink:#8CC3FF; --accent-soft:rgba(61,155,255,.13); --accent-soft-2:rgba(61,155,255,.22); --btn:#1A6FD6; --btn-fg:#FFFFFF;
  --navy:#E9EEF7; --navy-fg:#00071A; --yellow:#FFBE1A; --yellow-soft:rgba(255,190,26,.15); --yellow-ink:#FFD36B;
  --danger:#FF8A80; --danger-soft:rgba(255,100,90,.12); --ok:#5DD39E; --ok-soft:rgba(93,211,158,.13);
  --p-ai:#4DA3FF; --p-fs:#9D8CF0; --p-ds:#3CC7B5; --p-cy:#FF7A6E;
  --logo-filter:invert(1); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); --shadow-lg:0 24px 60px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060A14; --panel:#0C1424; --surface:#0E1628; --surface-2:#141D32; --fg:#EEF2F8; --muted:#B2BACB; --faint:#98A1B4; --border:#222C44; --border-strong:#2E3A57;
  --accent:#3D9BFF; --accent-ink:#8CC3FF; --accent-soft:rgba(61,155,255,.13); --accent-soft-2:rgba(61,155,255,.22); --btn:#1A6FD6; --btn-fg:#FFFFFF;
  --navy:#E9EEF7; --navy-fg:#00071A; --yellow:#FFBE1A; --yellow-soft:rgba(255,190,26,.15); --yellow-ink:#FFD36B;
  --danger:#FF8A80; --danger-soft:rgba(255,100,90,.12); --ok:#5DD39E; --ok-soft:rgba(93,211,158,.13);
  --p-ai:#4DA3FF; --p-fs:#9D8CF0; --p-ds:#3CC7B5; --p-cy:#FF7A6E;
  --logo-filter:invert(1); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); --shadow-lg:0 24px 60px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(30px,4.2vw,52px);font-weight:700;letter-spacing:-.035em;line-height:1.04}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
em.hl{font-style:italic;color:var(--accent);font-weight:800}
a{color:var(--accent-ink)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* app bar */
.topbar{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--border);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.topbar .in{max-width:1320px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:18px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;color:var(--fg);text-decoration:none}
.brand img{width:34px;height:34px;filter:var(--logo-filter)}
.brand b{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;margin-top:-3px}
nav.main{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.main::-webkit-scrollbar{display:none}
nav.main a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:9px 12px;border-radius:8px;white-space:nowrap;transition:background .15s,color .15s}
nav.main a:hover{color:var(--fg);background:var(--surface-2)}
nav.main a[aria-current="page"]{color:var(--accent-ink);background:var(--accent-soft)}
.navsep{width:1px;align-self:center;height:22px;background:var(--border-strong);margin:0 6px;flex-shrink:0}
nav.main a.setup{text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint)}
.tools{display:flex;gap:8px;align-items:center;flex-shrink:0}
.mockpill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border:1px dashed var(--border-strong);border-radius:999px;padding:4px 10px;white-space:nowrap}
.mockpill i{width:6px;height:6px;border-radius:999px;background:var(--yellow)}
@media (max-width:760px){.mockpill span{display:none}}
.kbd{font-size:11px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--faint);font-family:var(--font-body)}

.wrap{max-width:1320px;margin:0 auto;padding:28px 16px 80px;display:flex;flex-direction:column;gap:24px;animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}

/* building blocks */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;min-width:0;box-shadow:var(--shadow)}
.panel{background:var(--panel);border-radius:22px;padding:24px;min-width:0}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)} .faint{color:var(--faint);font-size:13px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:999px;background:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .12s,box-shadow .15s,background .15s,border-color .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--btn);color:var(--btn-fg);box-shadow:0 6px 16px rgba(0,114,229,.25)}
.btn.primary:hover{background:color-mix(in srgb,var(--btn) 88%,#000)}
.btn.ghost{background:var(--surface);border-color:var(--border-strong);color:var(--fg)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--navy);color:var(--navy-fg)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);transition:border-color .15s}
.iconbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.iconbtn.sm{width:34px;height:34px;border-radius:8px}
.iconbtn[disabled]{opacity:.3;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.blue{background:var(--accent-soft);color:var(--accent-ink)}
.chip.solid{background:var(--accent);color:#FFFFFF}
.chip.navy{background:var(--navy);color:var(--navy-fg)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.red{background:var(--danger-soft);color:var(--danger)}
.chip.win{background:var(--yellow);color:#00071A}
.chip.line{background:transparent;border:1px solid var(--border-strong);color:var(--muted)}
.dotc{width:8px;height:8px;border-radius:999px;display:inline-block;flex-shrink:0}
.tag{display:inline-block;padding:3px 9px;border-radius:7px;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:500}
.tag.hit{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{min-height:44px;border:1px solid var(--border-strong);border-radius:10px;padding:0 12px;background:var(--surface);color:var(--fg);font-size:14px;font-weight:400;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.field textarea{padding:10px 12px;min-height:90px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-size:14px;min-height:32px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--btn)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);font-weight:600;font-size:14px;cursor:pointer;transition:all .15s}
.pill:hover{border-color:var(--accent)}
.pill[aria-pressed="true"]{background:var(--navy);color:var(--navy-fg);border-color:var(--navy)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:2px}
.seg button{border:none;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.avatar{width:42px;height:42px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-family:var(--font-display);font-size:14px;color:#FFFFFF}
.avatar.lg{width:72px;height:72px;font-size:24px}
.avatar.xs{width:30px;height:30px;font-size:11px;border:2px solid var(--surface)}
.avstack{display:flex}.avstack .avatar{margin-left:-8px}.avstack .avatar:first-child{margin-left:0}
.switch{width:50px;height:30px;border-radius:999px;border:none;padding:3px;cursor:pointer;display:flex;background:var(--border-strong);flex-shrink:0;transition:background .2s}
.switch i{width:24px;height:24px;border-radius:999px;background:#FFFFFF;display:block;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--btn)}
.switch[aria-checked="true"] i{transform:translateX(20px)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .5s}
.bar.r>i{background:var(--danger)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;margin:0}
.kv dt{color:var(--faint)} .kv dd{margin:0;text-align:right}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:stretch}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.mockline{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 14px;max-width:760px}
.mockline b{color:var(--fg)}
.sweep{background:var(--navy);color:var(--navy-fg);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.sweep .big{font-family:var(--font-display);font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1}
.sweep .sub{opacity:.75;font-size:14px}
.sweep .glow{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:999px;background:radial-gradient(circle,rgba(0,128,255,.55),transparent 70%);pointer-events:none}
.sweep .chip{background:rgba(255,255,255,.12);color:inherit}
:root[data-theme="dark"] .sweep .chip{background:rgba(0,7,26,.08)}
.marquee{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.marquee .track{display:flex;gap:10px;width:max-content;animation:slide 220s linear infinite}
.marquee:hover .track,.marquee:focus-within .track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.mq{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--fg);transition:border-color .15s,background .15s}
.mq:hover{border-color:var(--accent);background:var(--accent-soft)}
.tinfo h4{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.tinfo ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.mq i{width:7px;height:7px;border-radius:999px;background:var(--accent)}

.weekly{background:linear-gradient(180deg,var(--panel),var(--surface));border:1px solid var(--border);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:18px}
.wtabs{display:flex;gap:6px;flex-wrap:wrap}
.wtabs button{border:1px solid var(--border-strong);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;min-height:38px}
.wtabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
.witems{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.witem{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s}
.witem:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.witem .stat{font-family:var(--font-display);font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--accent);line-height:1}
.witem .so{font-size:12px;color:var(--faint);margin-top:auto}
.witem .so a{color:var(--faint)}
.witem .do{font-size:13px;background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:8px 10px}
.titlecloud{display:flex;flex-wrap:wrap;gap:8px}
.titlecloud button{border:1px solid var(--border-strong);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.titlecloud button:hover{border-color:var(--accent);color:var(--accent-ink)}
.titlecloud button.new::after{content:"NEW";font-size:9px;font-weight:800;letter-spacing:.08em;margin-left:6px;color:var(--accent-ink)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .15s}
a.kpi:hover,button.kpi:hover{transform:translateY(-2px)}
button.kpi{font:inherit;text-align:left;cursor:pointer}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--font-display);font-size:36px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:12px;color:var(--faint)}
.kpi svg{margin-top:6px}
.kpi.alert .v{color:var(--danger)}
.donutwrap{display:grid;grid-template-columns:190px 1fr;gap:20px;align-items:center}
@media (max-width:520px){.donutwrap{grid-template-columns:1fr;justify-items:center}}
.donut circle.seg{cursor:pointer;transition:stroke-width .15s,opacity .15s}
.donut circle.seg:hover,.donut circle.seg.on{stroke-width:30}
.legendlist{display:flex;flex-direction:column;gap:6px;width:100%}
.legendlist button{display:flex;align-items:center;gap:10px;border:none;background:transparent;padding:6px 8px;border-radius:8px;cursor:pointer;text-align:left;font-size:14px;width:100%}
.legendlist button:hover,.legendlist button.on{background:var(--surface-2)}
.legendlist b{margin-left:auto;font-variant-numeric:tabular-nums}
.funnel{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:minmax(120px,160px) 1fr 70px;gap:12px;align-items:center;font-size:14px}
.fbar{height:30px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.fbar i{display:flex;align-items:center;justify-content:flex-end;padding-right:10px;height:100%;border-radius:8px;color:#FFFFFF;font-size:12px;font-weight:700;background:var(--accent)}
.drop{font-size:12px;color:var(--faint);text-align:right}
.chartbox{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:var(--navy-fg);font-size:12px;padding:6px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.quota{display:grid;grid-template-columns:minmax(110px,150px) 1fr 52px;gap:10px 12px;align-items:center;font-size:14px}
.qtrack{position:relative;height:14px;background:var(--surface-2);border-radius:999px}
.qtrack i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.qtrack b{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg);border-radius:2px}
.flow{display:flex;height:26px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.flow i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.todo{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface-2);transition:opacity .2s}
.todo .t{flex:1;min-width:0;font-size:14px}
.todo .bul{width:10px;height:10px;border-radius:999px;flex-shrink:0}
.todo.done{opacity:.55}.todo.done .t{text-decoration:line-through}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:900px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:14px 16px;background:var(--surface-2)}
td{padding:12px 16px;border-top:1px solid var(--border);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover td{background:var(--panel)}
.namecell{display:flex;align-items:center;gap:12px}
.namebtn{background:none;border:none;padding:0;font-weight:600;cursor:pointer;text-align:left;color:var(--fg);font-size:14px}
.namebtn:hover{color:var(--accent-ink);text-decoration:underline}
.mini{display:flex;align-items:center;gap:8px;min-width:140px}
.mini .bar{flex:1}

/* jobs */
.job{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:start;transition:transform .15s,box-shadow .15s}
.job:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,7,26,.1)}
@media (max-width:760px){.job{grid-template-columns:1fr}}
.logo{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:17px;color:#FFFFFF;flex-shrink:0}
.ring{position:relative;width:64px;height:64px;flex-shrink:0}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:15px}
.why{font-size:13px;color:var(--danger)}
.matchlist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.mrow{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 10px;background:var(--surface-2);border-radius:12px;flex-wrap:wrap}

/* graduate */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:200px;transition:background .15s,outline-color .15s;outline:2px dashed transparent;outline-offset:-2px}
.col.over{background:var(--accent-soft);outline-color:var(--accent)}
.col h4{margin:0;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:grab;box-shadow:0 1px 2px rgba(0,7,26,.05)}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.4}
.kcard .acts{display:flex;gap:6px}
.log{display:grid;grid-template-columns:20px 1fr;gap:12px;padding:10px 0;font-size:14px;position:relative}
.log::before{content:"";position:absolute;left:5px;top:28px;bottom:-8px;width:2px;background:var(--border)}
.log:last-child::before{display:none}
.log .b{width:12px;height:12px;border-radius:999px;background:var(--accent);margin-top:4px;box-shadow:0 0 0 4px var(--accent-soft)}

/* sources */
.src{display:flex;flex-direction:column;gap:12px}
.meter{display:inline-flex;gap:3px;align-items:center}
.meter i{width:16px;height:6px;border-radius:999px;background:var(--border-strong)}
.meter i.on{background:var(--accent)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:14px}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}

/* modal, toast, palette */
.modal-bg{position:fixed;inset:0;background:rgba(0,7,26,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.modal{background:var(--surface);color:var(--fg);border-radius:22px;max-width:660px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:26px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-lg);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.97) translateY(6px)}to{transform:none}}
.modal pre{white-space:pre-wrap;font-family:var(--font-body);font-size:14px;background:var(--surface-2);border-radius:14px;padding:16px;margin:0;line-height:1.55}
.palette{max-width:600px;padding:0;gap:0;align-self:flex-start;margin-top:10vh}
.palette input{border:none;border-bottom:1px solid var(--border);padding:18px 20px;font-size:17px;background:transparent;color:var(--fg);outline:none;width:100%}
.palette ul{list-style:none;margin:0;padding:8px;max-height:50vh;overflow:auto}
.palette li button{display:flex;width:100%;align-items:center;gap:12px;border:none;background:transparent;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;font-size:14px}
.palette li button:hover,.palette li button.on{background:var(--accent-soft)}
.palette li small{margin-left:auto;color:var(--faint)}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(420px,calc(100% - 32px))}
.toast{background:var(--navy);color:var(--navy-fg);padding:12px 16px;border-radius:14px;font-size:14px;box-shadow:var(--shadow-lg);animation:pop .2s ease-out;display:flex;gap:10px;align-items:flex-start}
.toast small{display:block;opacity:.72;font-size:12px}
.toast .ic{width:20px;height:20px;border-radius:999px;background:var(--accent);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.footer{max-width:1320px;margin:0 auto;padding:0 16px 40px;color:var(--faint);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
</style>
</head>

function rejectReasons(j){
  const r=[];
  if(!j.us) r.push('Outside the US');
  if(!j.easy) r.push('Not Easy Apply');
  if(j.level==='Senior') r.push('Senior level');
  if(j.applicants>50) r.push('Over 50 applicants');
  if(j.hours>24) r.push('Older than 24 hours');
  return r;
}

  if(g.program!==j.program) return 0;
  const hits=j.skills.filter(s=>g.skills.includes(s)).length;
  return Math.min(97,50+Math.round(40*hits/j.skills.length)+(g.modes.includes(j.mode)?8:0));
}

function ring(pct,size=64,stroke=6){
  const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/></svg><span>${pct}%</span></div>`;
}
function spark(vals,w=160,h=36){
  const mx=Math.max(...vals),mn=Math.min(...vals),sx=w/(vals.length-1);
  const pts=vals.map((v,i)=>[i*sx,h-4-(v-mn)/((mx-mn)||1)*(h-8)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h}Z" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--accent)"/></svg>`;
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#confetti'),ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#0080FF','#FFBE1A','#6D5BD0','#0E9384','#00071A','#99CCFF'];
  const ps=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
  let t=0;(function f(){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()});if(++t<110)requestAnimationFrame(f);else ctx.clearRect(0,0,cv.width,cv.height)})();
}

function trendChart(v){
  const w=560,h=200,pl=34,pb=26,pt=12,mx=Math.ceil(Math.max(...v)/20)*20;
  const sx=(w-pl-10)/(v.length-1),y=n=>pt+(h-pt-pb)*(1-n/mx);
  const pts=v.map((n,i)=>[pl+i*sx,y(n)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const grid=[0,mx/2,mx].map(g=>`<line x1="${pl}" x2="${w-10}" y1="${y(g)}" y2="${y(g)}" stroke="var(--border)"/><text x="${pl-8}" y="${y(g)+4}" text-anchor="end" font-size="11" fill="var(--faint)">${g}</text>`).join('');
  const labels=v.map((n,i)=>`<text x="${pts[i][0]}" y="${h-6}" text-anchor="middle" font-size="11" fill="var(--faint)">${i===v.length-1?'This wk':'W'+(i+1)}</text>`).join('');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" role="img" aria-label="Applications per week, rising from ${v[0]} to ${v[v.length-1]}">${grid}<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><path d="${d} L${pts[pts.length-1][0]} ${y(0)} L${pl} ${y(0)}Z" fill="url(#ga)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===v.length-1?6:4}" fill="${i===v.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2.5" data-tip="${i===v.length-1?'This week':'Week '+(i+1)}: ${v[i]} applications" style="cursor:pointer"/>`).join('')}${labels}</svg>`;
}

function route(){
  const h=(location.hash||'#home').slice(1);
  let html;
  if(h.startsWith('grad-')) html=vGrad(h.slice(5));
  else html=({home:vHome,graduates:vGraduates,radar:vRadar,sources:vSources,pipeline:vPipeline,automations:vAutomations,integrations:vIntegrations}[h]||vHome)();
  const navKey=h.startsWith('grad-')?'graduates':h;
  document.querySelectorAll('nav.main a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+navKey?'page':'false'));
  const act=document.activeElement;const aid=act&&act.id;const pos=act&&act.selectionStart;
  $('#app').innerHTML=html;
  if(aid){const el=document.getElementById(aid);if(el){el.focus({preventScroll:true});try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
  bindChart();
}
function bindChart(){
  const box=$('#trend');if(!box)return;const tip=$('#trendtip');
  box.querySelectorAll('[data-tip]').forEach(c=>{
    c.addEventListener('mouseenter',()=>{const r=c.getBoundingClientRect(),b=box.getBoundingClientRect();tip.textContent=c.dataset.tip;tip.style.left=(r.left-b.left+r.width/2)+'px';tip.style.top=(r.top-b.top)+'px';tip.classList.add('on')});
    c.addEventListener('mouseleave',()=>tip.classList.remove('on'));
  });
}
let lastHash=location.hash;
window.addEventListener('hashchange',()=>{route();if(location.hash!==lastHash){window.scrollTo(0,0);lastHash=location.hash;const w=$('#app');w.style.animation='none';void w.offsetWidth;w.style.animation=''}});

function compose(gid,preJob){
  const g=byId(gid);const opts=jobsFor(g).slice(0,6);
  if(!opts.length){toast('No matching jobs for '+g.name+' today.');return}
  let picked=preJob?[preJob]:opts.slice(0,2).map(x=>x.j.id);
  const build=()=>{const js=picked.map(jobById);
    const lines=js.map((j,i)=>`${i+1}. ${j.title} \u2013 ${j.company} (${j.mode}, ${j.loc}): it asks for ${j.skills.filter(s=>g.skills.includes(s)).join(', ')||j.skills[0]}, which you already have.\nlinkedin.com/jobs/view/[JOB ID]`).join('\n\n');
    return `Hi ${first(g.name)}!\n\nI found ${js.length} Easy Apply role${js.length===1?'':'s'} posted in the last 24 hours that fit your profile:\n\n${lines}\n\nApply today: early applications get far more interviews. Log them in your Job Hunting Tracker so they count toward your weekly goal.`};
  const render=()=>openModal('Message to '+esc(g.name),`<p class="muted">Pick up to 2 jobs. Team rule: Easy Apply only, and never more than 2 links in one message.</p>
    <div class="stack" style="gap:6px">${opts.map(x=>`<label class="check"><input type="checkbox" id="cj-${x.j.id}" data-cj="${x.j.id}" ${picked.includes(x.j.id)?'checked':''} ${!picked.includes(x.j.id)&&picked.length>=2?'disabled':''}>${esc(x.j.title)} \u00B7 ${esc(x.j.company)} <span class="chip blue num">${x.m}%</span></label>`).join('')}</div>
    <div class="between"><span class="eyebrow">Slack DM draft</span><span class="chip ok num">Links: ${picked.length}/2</span></div>
    <pre id="draft">${esc(build())}</pre>`,[
    {label:'Copy text',fn:()=>{const t=build();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied to clipboard')).catch(()=>{const r=document.createRange();r.selectNodeContents($('#draft'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Text selected. Press \u2318C or Ctrl+C to copy.')})}},
    {label:'Mark as sent',kind:'primary',fn:()=>{picked.forEach(id=>{const j=jobById(id);S.tracker[g.id].Saved.push({t:j.title,c:j.company,auto:true})});S.logs[g.id].unshift({d:'Today',t:'Sent '+picked.length+' Easy Apply job(s) by Slack',by:'You \u00B7 Career Hub'});closeModal();route();toast('Logged for '+g.name,SIM)}}]);
  render();
  $('#modal-root').onchange=e=>{const id=e.target.dataset.cj;if(!id)return;picked=e.target.checked?[...picked,id].slice(0,2):picked.filter(x=>x!==id);if(!picked.length)picked=[opts[0].j.id];render()};
}
function sweepSettings(){
  let prog=PROGRAMS[0];
  const body=()=>`<div class="row"><label class="field">Run every day at<select id="sw-time">${['07:00','08:00','09:00','10:00','11:00'].map(t=>`<option value="${t}" ${t===S.sweep.time?'selected':''}>${fmt12(t)} ET</option>`).join('')}</select></label>
    <label class="field">Look back<select id="sw-win">${[['24','Last 24 hours'],['48','Last 48 hours'],['72','Last 3 days']].map(([v,l])=>`<option value="${v}" ${v===S.sweep.window?'selected':''}>${l}</option>`).join('')}</select></label></div>
    <span class="eyebrow">Job titles to search</span>
    <div class="pills">${PROGRAMS.map(p=>`<button class="pill" data-sw-prog="${p}" aria-pressed="${p===prog}">${progDot(p)}${p}</button>`).join('')}</div>
    <div class="titlecloud">${[...S.sweep.titles[prog].fresh,...S.sweep.titles[prog].base].map(t=>`<button data-sw-del="${esc(t)}" aria-label="Remove ${esc(t)}">${esc(t)} \u2715</button>`).join('')}</div>
    <div class="row" style="align-items:flex-end"><label class="field" style="flex:1">Add a title<input id="sw-new" placeholder="e.g. Customer Engineer"></label><button class="btn ghost" data-sw-add="1">Add</button></div>
    <p class="faint">Sources are chosen on the Job Sources page. Running once a day keeps server and AI costs low.</p>`;
  const render=()=>{openModal('Daily sweep settings',body(),[{label:'Cancel'},{label:'Save schedule',kind:'primary',fn:()=>{S.sweep.time=$('#sw-time').value;S.sweep.window=$('#sw-win').value;closeModal();route();toast('Sweep scheduled daily at '+fmt12(S.sweep.time)+' ET','Last '+S.sweep.window+' hours. '+SIM)}}]);
    $('#modal-root .modal').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.swProg){const t=$('#sw-time').value,w=$('#sw-win').value;prog=b.dataset.swProg;render();$('#sw-time').value=t;$('#sw-win').value=w}
      else if(b.dataset.swDel){const set=S.sweep.titles[prog];set.fresh=set.fresh.filter(x=>x!==b.dataset.swDel);set.base=set.base.filter(x=>x!==b.dataset.swDel);render()}
      else if(b.dataset.swAdd){const v=$('#sw-new').value.trim();if(v){S.sweep.titles[prog].base.push(v);render();toast('Added \u201C'+v+'\u201D to '+prog)}}
    })};
  render();
}
function palette(){
  const items=[...G.map(g=>({l:g.name,s:g.program+' \u00B7 '+STAGES[g.stage].label,go:'grad-'+g.id,av:g})),...J.filter(passes).map(j=>({l:j.title+' \u00B7 '+j.company,s:'Job \u00B7 '+SRCN(j.source).name,go:'radar'})),...[['Overview','home'],['Job Radar','radar'],['Graduates','graduates'],['Talent Pipeline','pipeline'],['Automations','automations'],['Job Sources','sources'],['Integrations','integrations']].map(([l,go])=>({l,s:'Page',go}))];
  let sel=0;lastFocus=document.activeElement;
  $('#modal-root').innerHTML=`<div class="modal-bg" data-act="modal-bg"><div class="modal palette" role="dialog" aria-modal="true" aria-label="Search"><input id="pal" placeholder="Search graduates, jobs or pages\u2026" autocomplete="off"><ul id="pal-list"></ul></div></div>`;
  const list=()=>{const q=$('#pal').value.toLowerCase();const res=items.filter(i=>(i.l+' '+i.s).toLowerCase().includes(q)).slice(0,9);sel=Math.min(sel,Math.max(0,res.length-1));
    $('#pal-list').innerHTML=res.map((i,k)=>`<li><button class="${k===sel?'on':''}" data-act="pal-go" data-go="${i.go}">${i.av?avatar(i.av,'xs'):'<span class="dotc" style="background:var(--accent)"></span>'}${esc(i.l)}<small>${esc(i.s)}</small></button></li>`).join('')||'<li class="faint" style="padding:12px">No results</li>';return res};
  let res=list();const inp=$('#pal');inp.focus();
  inp.addEventListener('input',()=>{sel=0;res=list()});
  inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){sel=Math.min(sel+1,res.length-1);res=list();e.preventDefault()}else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);res=list();e.preventDefault()}else if(e.key==='Enter'&&res[sel]){closeModal();location.hash=res[sel].go}});
}
function titleInfo(title){
  const d=TITLE_INFO[title];
  if(!d){toast(title,'No details yet for this title.');return}
  const q=encodeURIComponent(title.replace(/ \(.*\)/,''));
  const li=`https://www.linkedin.com/jobs/search/?keywords=${q}&location=United%20States&geoId=103644278&f_TPR=r86400&f_E=1%2C2&f_AL=true&sortBy=DD`;
  const set=S.sweep.titles[d.p];const inSweep=[...set.fresh,...set.base].includes(title);
  openModal(esc(title),`<div class="row"><span class="chip" style="background:${pc(d.p)};color:#fff">${d.p}</span>${d.pay?`<span class="chip blue">${esc(d.pay)}</span>`:''}</div>
    <div class="tinfo stack" style="gap:14px">
      <div><h4>What the job is</h4><p>${esc(d.why)}</p></div>
      <div><h4>Why our graduates qualify</h4><ul>${d.tools.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="faint" style="margin-top:6px">From the <a href="${PROG_URL[d.p]}" target="_blank" rel="noopener">${d.p} program page</a>.</p></div>
      <div><h4>Why search it, not only \u201CAI Engineer\u201D</h4><p>${esc(d.beyond)}</p></div>
      ${d.payUrl?`<p class="faint">Pay: <a href="${d.payUrl}" target="_blank" rel="noopener">${d.payUrl.includes('ziprecruiter')?ZR:'4Geeks program page'}</a></p>`:''}
    </div>
    <a class="btn ghost" href="${li}" target="_blank" rel="noopener">Search on LinkedIn: US, last 24 h, Easy Apply ${I.ext}</a>`,
    [{label:inSweep?'Already in the daily sweep':'Add to daily sweep',kind:inSweep?'ghost':'primary',fn:()=>{if(!inSweep)set.base.push(title);closeModal();toast(inSweep?title+' is already in the sweep':'\u201C'+title+'\u201D added to the '+d.p+' sweep','Runs daily at '+fmt12(S.sweep.time)+' ET. '+SIM)}}]);
}
function moveCard(gid,from,ki,to){
  const g=byId(gid);if(from===to)return;const card=S.tracker[g.id][from].splice(ki,1)[0];if(!card)return;S.tracker[g.id][to].push(card);
  if(to==='Interview'){S.logs[g.id].unshift({d:'Today',t:'Interview kit drafted for '+card.c,by:'Automatic \u00B7 Interview kit'});toast('Moved to Interview','Interview kit drafted for '+card.c+'. '+SIM)}
  else if(to==='Offer'){confetti();S.logs[g.id].unshift({d:'Today',t:'Offer from '+card.c,by:'You \u00B7 Job Hunting Tracker'});toast('An offer for '+first(g.name)+'!','Check it is a qualified offer: 15+ hours a week or 10+ weeks.')}
  else toast('Moved to '+to);
  route();
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='modal-bg'&&e.target!==t)return;
  switch(a){
    case 'modal-bg':case 'modal-close':closeModal();break;
    case 'modal-action':{const ac=modalActions[+t.dataset.i];if(ac&&ac.fn)ac.fn();else closeModal();break}
    case 'go':location.hash=t.dataset.to;break;
    case 'pal-go':closeModal();location.hash=t.dataset.go;break;
    case 'palette':palette();break;
    case 'theme':{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';break}
    case 'hide-notice':S.noticeHidden=true;route();toast('Note hidden','The \u201CMockup\u201D label stays in the top bar.');break;
    case 'risk-filter':S.gf.risk=true;S.gf.stage='All';break;
    case 'stage-filter':S.gf.stage=t.dataset.s;S.gf.risk=false;break;
    case 'donut':S.donut=S.donut===t.dataset.s?null:t.dataset.s;route();break;
    case 'wtab':S.wtab=t.dataset.t;route();break;
    case 'title-info':titleInfo(t.dataset.t);break;
    case 'todo':S.done[t.dataset.k]=!S.done[t.dataset.k];route();break;
    case 'nudge':{const g=byId(t.dataset.id);S.logs[g.id].unshift({d:'Today',t:'Slack reminder sent',by:'You \u00B7 Career Hub'});toast('Reminder to '+g.name+' logged',SIM);break}
    case 'launch':openModal('Launch GeekForce for a cohort',`<label class="field">Cohort<select id="lc"><option>ft-ai-2 \u00B7 AI Engineering</option><option>ds-13 \u00B7 Data Science & ML</option><option>pt-fs-35 \u00B7 Full Stack</option></select></label>
      <label class="check"><input id="lc1" type="checkbox" checked>Launch email in ActiveCampaign</label><label class="check"><input id="lc2" type="checkbox" checked>Slack message with the survey and Calendly link</label><label class="check"><input id="lc3" type="checkbox" checked>Drive folder and checklist for each student</label>
      <p class="faint">In the real tool, a coach reviews each draft before anything goes out.</p>`,[{label:'Cancel'},{label:'Launch',kind:'primary',fn:()=>{const c=$('#lc').value;closeModal();toast('GeekForce launched for '+c,SIM)}}]);break;
    case 'move':{const cols=['Saved','Applied','Interview','Offer'];const c=t.dataset.c;moveCard(t.dataset.id,c,+t.dataset.k,cols[cols.indexOf(c)+ +t.dataset.dir]);break}
    case 'compose':compose(t.dataset.id,t.dataset.job);break;
    case 'stub':toast(t.dataset.msg,'Not connected in the mockup.');break;
    case 'rprog':S.rf.program=t.dataset.p;route();break;
    case 'rsrc':S.rf.source=t.dataset.s;route();break;
    case 'rview':S.rf.view=t.dataset.v;route();break;
    case 'sweep-settings':e.preventDefault();sweepSettings();break;
    case 'run-sweep':{S.sweep.lastRun='Today, '+now();route();toast('Sweep finished',J.length+' jobs found, '+J.filter(passes).length+' passed. Sample data.');break}
    case 'toggle-matches':S.openMatches[t.dataset.job]=!S.openMatches[t.dataset.job];route();break;
    case 'send-all':{const j=jobById(t.dataset.job);const ms=matchesFor(j);ms.forEach(x=>{S.tracker[x.g.id].Saved.push({t:j.title,c:j.company,auto:true});S.logs[x.g.id].unshift({d:'Today',t:'Sent '+j.title+' at '+j.company,by:'You \u00B7 Job Radar'})});S.sent[j.id]=ms.length;route();toast('Drafted for '+ms.length+' graduate(s)','Added to their trackers as Saved. '+SIM);break}
    case 'src-toggle':{const id=t.dataset.id;S.sweep.on[id]=!S.sweep.on[id];if(!S.sweep.on[id]&&S.rf.source===id)S.rf.source='all';route();toast(SRCN(id).name+(S.sweep.on[id]?' added to':' removed from')+' the daily sweep');break}
    case 'src-connect':{const s=SRCN(t.dataset.id);openModal('Connect '+esc(s.name),`<div class="row"><span class="logo" style="background:${s.color}">${s.mono}</span><div><b>${esc(s.method)}</b><div class="faint">How students apply: ${esc(s.easy)}</div></div></div><p class="muted">${esc(s.note)}</p>
      ${s.id==='linkedin'?`<ol class="steps"><li><div>Save one LinkedIn search per program with <b>Past 24 hours</b>, <b>United States</b> and <b>Easy Apply</b>, and turn on daily alerts.</div></li><li><div>The Hub reads those alert emails at ${fmt12(S.sweep.time)} ET.</div></li><li><div>For a deeper look, it can open the search in your own logged-in Chrome and read the results with you watching.</div></li></ol>`:''}
      <p class="faint">Mockup: nothing is connected. This shows how the connection would work after approval.</p>`,[{label:'Close'},{label:s.feas?'Connect in demo mode':'Send link to check',kind:'primary',fn:()=>{S.srcConn[s.id]=true;closeModal();route();toast(s.name+' connected in demo mode','Sample data only.')}}]);break}
    case 'roadmap':S.roadmap[t.dataset.k]=!S.roadmap[t.dataset.k];route();break;
    case 'profile':{const g=byId(t.dataset.id);openModal(esc(g.name),`<div class="row">${avatar(g,'lg')}<div><p style="font-family:var(--font-display);font-style:italic;font-weight:700;color:var(--accent-ink)">\u201C${esc(g.motto)}\u201D</p><span class="faint">${g.program} \u00B7 ${g.cohort}</span></div></div><dl class="kv"><dt>Level</dt><dd>Entry</dd><dt>Location</dt><dd>${esc(g.loc)}</dd><dt>Work mode</dt><dd>${g.modes.join(', ')}</dd><dt>Targets</dt><dd>${esc(g.targets)}</dd><dt>Background</dt><dd>${esc(g.edge)}</dd></dl><div class="row">${g.skills.map(s=>`<span class="tag hit">${esc(s)}</span>`).join('')}</div>`,[{label:'Open full file',kind:'primary',fn:()=>{closeModal();location.hash='grad-'+g.id}}]);break}
    case 'propose':{const g=byId(t.dataset.id);openModal('Propose '+esc(g.name),`<label class="field">Company<select id="pc">${PARTNERS.map(p=>`<option>${p}</option>`).join('')}</select></label><label class="field">Note for the company<textarea id="pn">${esc(first(g.name))} closed GeekForce Stages 1 and 2 and fits roles like ${esc(g.targets)}.</textarea></label>`,[{label:'Cancel'},{label:'Save proposal',kind:'primary',fn:()=>{const c=$('#pc').value;S.logs[g.id].unshift({d:'Today',t:'Proposed to '+c,by:'You \u00B7 Talent Pipeline'});closeModal();toast(g.name+' proposed to '+c,SIM)}}]);break}
    case 'copy-shortlist':{const j=jobById(S.pf.job);const best=G.filter(seeking).map(g=>({g,m:match(g,j)})).filter(x=>x.m>0).sort((a,b)=>b.m-a.m).slice(0,5);const txt=`Shortlist for ${j.title} at ${j.company}:\n`+best.map(x=>`- ${x.g.name} (${x.g.program}, ${x.g.loc}) \u00B7 ${x.m}% match \u00B7 ${x.g.skills.slice(0,3).join(', ')}`).join('\n');(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Shortlist copied')).catch(()=>openModal('Shortlist',`<pre>${esc(txt)}</pre>`,[{label:'Close'}]));break}
    case 'auto-toggle':S.autosOn[t.dataset.id]=!S.autosOn[t.dataset.id];route();toast(AUTOS.find(x=>x.id===t.dataset.id).name+(S.autosOn[t.dataset.id]?' turned on':' turned off'));break;
    case 'auto-run':{const id=t.dataset.id;const a=AUTOS.find(x=>x.id===id);const sk=G.filter(seeking);const r={
      a0:`${J.length} jobs found across ${Object.values(S.sweep.on).filter(Boolean).length} sources in the last ${S.sweep.window} hours.`,
      a9:'This week\u2019s issue is ready at the top of the Overview.',
      a1:`${J.filter(passes).length} passed, ${J.length-J.filter(passes).length} filtered out.`,
      a2:`${J.filter(passes).reduce((n,j)=>n+matchesFor(j).length,0)} graduate\u2013job matches at 70% or more.`,
      a3:`${sk.filter(g=>jobsFor(g).length).length} Slack drafts ready for review (max 2 links each).`,
      a4:`${G.filter(g=>g.stage==='not_started'&&g.last>=7).length} graduates flagged in the Not Started ladder.`,
      a5:`${sk.filter(g=>g.last>=14).length} graduates in Stage 3 without a check-in for 14+ days.`,
      a6:`${sk.filter(g=>g.apps<PLANS[g.plan].apps).length} graduates below their weekly application goal.`,
      a7:`${G.filter(g=>g.stage==='interviewing').length} interview kits drafted.`,
      a8:`${J.filter(j=>j.partner&&passes(j)).length} partner jobs with a 3\u20135 profile shortlist.`}[id];
      S.autoLog.unshift({t:now(),n:a.name,r});route();toast(a.name+' ran',r);break}
    case 'integ':{const i=INTEGRATIONS.find(x=>x.id===t.dataset.id);openModal(esc(i.name),`<p class="muted">${i.use}</p><p><b>Access:</b> ${i.phase}.</p><p class="faint">To connect it for real, an admin of the GeekForce workspace creates an access key with read permissions. In the mockup you can only run a demo test.</p>`,[{label:'Close'},{label:'Run demo test',kind:'primary',fn:()=>{S.integ[i.id]=true;closeModal();route();toast(i.name+': demo test passed','Sample data only.')}}]);break}
  }
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.f;if(!k||e.target.type==='checkbox'||e.target.tagName==='SELECT')return;
  const [o,p]=k.split('.');S[o][p]=e.target.value;route();
});
document.addEventListener('change',e=>{
  const el=e.target;if(el.closest('#modal-root'))return;
  if(el.dataset.mode){S.rf.modes[el.dataset.mode]=el.checked;route();return}
  if(el.dataset.actChange==='stage'){const g=byId(el.dataset.id);g.stage=el.value;S.logs[g.id].unshift({d:'Today',t:'Stage changed to '+STAGES[g.stage].label,by:'You \u00B7 Career Hub'});if(g.stage==='placed')confetti();route();toast(g.stage==='placed'?first(g.name)+' is placed!':'Stage updated','In the real tool this updates Notion after confirmation.');return}
  const k=el.dataset.f;if(!k)return;const [o,p]=k.split('.');
  S[o][p]=el.type==='checkbox'?el.checked:el.value;route();
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form="log"]');if(!f)return;e.preventDefault();
  const g=byId(f.dataset.id);const note=f.note.value.trim();
  S.logs[g.id].unshift({d:'Today',t:f.type.value+(note?': '+note:''),by:'You \u00B7 Career Hub'});g.last=0;route();toast('Check-in logged for '+g.name,'In the real tool this goes to the Student Profile in Notion.');
});
let drag=null;
document.addEventListener('dragstart',e=>{const k=e.target.closest&&e.target.closest('[data-drag]');if(!k)return;const [c,i]=k.dataset.drag.split('|');drag={c,i:+i};k.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',k.dataset.drag)}catch(_){}});
document.addEventListener('dragend',e=>{document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'))});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(!c||!drag)return;e.preventDefault();document.querySelectorAll('.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(!c||!drag)return;e.preventDefault();const d=drag;drag=null;moveCard(c.dataset.id,d.c,d.i,c.dataset.drop)});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palette();return}
  if(e.key==='Escape'&&$('#modal-root').innerHTML)closeModal();
});
route();
})();
</script>
